<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SOS Midnight</title>
<!-- Created by Mark Livera 2026 -->

<style>
body {
    background-color: #000;
    color: #fff;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    margin: 0;
    height: 100vh;
    overflow: hidden;
    box-sizing: border-box;
}

.panel {
    background-color: #121212;
    padding: 25px;
    border-radius: 12px;
    border: 1px solid #333;
    width: fit-content;
    max-width: 95vw;
    margin-bottom: 20px;
    text-align: center;
    box-sizing: border-box;
}

#game.panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: calc(100vh - 40px);
    max-height: calc(100vh - 40px);
    overflow: hidden;
}
:root {
    --p1: #ff291d;
    --p2: #0011ff;
    --p3: #34C759;
    --p4: #FFD60A;
    --p5: #AF52DE;
    --p6: #ec7e00;
    --p7: #1fe9df;
    --p8: #ff4a6b;
    --p9: #185c16;
}
.cell { background: #000; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: bold; cursor: pointer; color: #fff; }

.cell.highlighted { outline: 2px solid #03dac6; background: #1a1a1a; z-index: 5; }

.overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center; }

.popup { background: #121212; padding: 30px; border-radius: 15px; border: 2px solid #03dac6; text-align: center; min-width: 250px; }

.color-preview-btn { width: 40px; height: 40px; border-radius: 8px; border: 2px solid #444; cursor: pointer; display: inline-block; margin-left: 10px; }

.color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }

.swatch { width: 50px; height: 50px; border-radius: 8px; cursor: pointer; border: 3px solid transparent; }

.swatch:hover:not(.disabled) { transform: scale(1.1); border-color: #fff; }

.swatch.disabled { opacity: 0.1; cursor: not-allowed; filter: grayscale(1); }

.swatch.selected { border-color: #03dac6; }

input { background: #000; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 6px; }

.btn-main { background: #03dac6; color: #000; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 15px; }

.choice-btn { font-size: 32px; width: 80px; height: 80px; margin: 10px; cursor: pointer; background: #222; color: #fff; border: 1px solid #444; border-radius: 10px; }

.player-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; background: #1a1a1a; padding: 10px; border-radius: 8px; }

.sos-line {
    position: absolute;
    height: 4px;
    border-radius: 2px;
    transform-origin: left center;
    pointer-events: none;
    z-index: 10;
    box-shadow: 0 0 10px currentColor;
}

#board {
    display: grid;
    gap: 4px;
    background: #333;
    border: 4px solid #333;
    margin: 20px auto;
    position: relative;
    width: fit-content;
    max-width: 100%;
    max-height: 100%;
    overflow: hidden;
    flex-shrink: 1;
}
</style>
</head>

<body>

<div id="setup" class="panel">
<h2 style="color:#03dac6">SOS Midnight</h2>
<p style="margin:10px 0;color:#d1d407;font-size:20px;">
A take on the old classic naughts and crosses game.
</p>
<p style="margin:10px 0;color:#37a2fa;font-size:15px;">
Select number of players, Enter player names, select colour or except default, </p> 
<P  style="margin:10px 0;color:#37a2fa;font-size:15px;">
select grid shape, change size or accept default and press start game.
</p>

<div style="display:flex; gap:15px; justify-content:center; align-items:center; flex-wrap:wrap;">

    <input type="number" id="rows" value="8" min="3" max="20" style="width:60px">
    ×
    <input type="number" id="cols" value="8" min="3" max="20" style="width:60px">

    <select id="gridMode" onchange="handleGridModeChange()" style="padding:6px;background:#000;color:#fff;border:1px solid #444;">
        <option value="square">Square</option>
        <option value="rectangle">Rectangle</option>
    </select>

    <div>Players:
        <input type="number" id="pCount" value="2" min="2" max="8" onchange="handlePCountChange()">
    </div>

</div>

<div id="p-list"></div>
<button class="btn-main" onclick="startGame()">Start Game</button>
</div>

<div id="game" class="panel" style="display:none">
<div id="score-board" style="display:flex; flex-wrap:wrap; gap:15px; justify-content:center;"></div>
<div id="board"></div>
<button class="btn-main" style="background:#333;color:#aaa;" onclick="location.reload()">Quit Game</button>
</div>

<div id="letter-overlay" class="overlay">
<div class="popup">
<h2 id="p-prompt">Select Letter</h2>
<button class="choice-btn" onclick="makeMove('S')">S</button>
<button class="choice-btn" onclick="makeMove('O')">O</button>
<div onclick="closeLetterPopup()" style="margin-top:20px;color:#666;cursor:pointer;text-decoration:underline;">Cancel</div>
</div>
</div>

<div id="color-overlay" class="overlay">
<div class="popup">
<h3>Choose Your Color</h3>
<div id="color-grid" class="color-grid"></div>
<div onclick="closeColorPopup()" style="margin-top:20px;color:#666;cursor:pointer;text-decoration:underline;">Close</div>
</div>
</div>

<script>
let game = {
    size: 8,
    players: [],
    turn: 0,
    grid: [],
    activeCell: null,
    pickingFor: null
};

let cellPositions = [];

const palette = [
    getComputedStyle(document.documentElement).getPropertyValue('--p1').trim(),
    getComputedStyle(document.documentElement).getPropertyValue('--p2').trim(),
    getComputedStyle(document.documentElement).getPropertyValue('--p3').trim(),
    getComputedStyle(document.documentElement).getPropertyValue('--p4').trim(),
    getComputedStyle(document.documentElement).getPropertyValue('--p5').trim(),
    getComputedStyle(document.documentElement).getPropertyValue('--p6').trim(),
    getComputedStyle(document.documentElement).getPropertyValue('--p7').trim(),
    getComputedStyle(document.documentElement).getPropertyValue('--p8').trim(),
    getComputedStyle(document.documentElement).getPropertyValue('--p9').trim()
];

function handlePCountChange(){
    let v = document.getElementById("pCount");
    v.value = Math.max(2, Math.min(8, v.value));

    const count = parseInt(v.value);

    game.players = game.players.slice(0, count);

    const usedColors = game.players.map(p => p.color);

    for(let i = 0; i < count; i++){

        if(!game.players[i]){
            const availableColor = palette.find(color => !usedColors.includes(color));

            game.players[i] = {
                name: `Player ${i+1}`,
                color: availableColor || palette[0]
            };

            usedColors.push(game.players[i].color);
        }
    }

    renderPlayerSetup();
}
function handleGridSizeChange(){
    let v = document.getElementById("size");
    v.value = Math.max(3, Math.min(20, parseInt(v.value) || 8));
}
function handleGridModeChange(){
    const mode = document.getElementById("gridMode").value;

    const r = document.getElementById("rows");
    const c = document.getElementById("cols");

    if(mode === "square"){
        r.value = Math.min(r.value, 20);
        c.value = r.value;

        r.oninput = () => {
            c.value = r.value;
        };

        c.oninput = () => {
            r.value = c.value;
        };
    }

    if(mode === "rectangle"){
        r.oninput = null;
        c.oninput = null;

        r.value = 8;
        c.value = 12;
    }
}
function renderPlayerSetup(){
    const c = document.getElementById("p-list");
    const count = document.getElementById("pCount").value;
    c.innerHTML = "";

    for(let i=0;i<count;i++){

        if(!game.players[i]){
            game.players[i] = {
                name:`Player ${i+1}`,
                color: palette[i]
            };
        }

        if(!game.players[i].color){
            const usedColors = game.players
                .map((p,index)=>index !== i ? p.color : null);

            const availableColor = palette.find(color => !usedColors.includes(color));

            game.players[i].color = availableColor || palette[0];
        }

        c.innerHTML += `
        <div class="player-row">
            <input value="${game.players[i].name}" oninput="game.players[${i}].name=this.value">
            <div class="color-preview-btn"
                 id="preview-${i}"
                 style="background:${game.players[i].color}"
                 onclick="openColorPicker(${i})"
                 title="Click to select colour"></div>
        </div>`;
    }
}

function openColorPicker(i){
    game.pickingFor=i;
    const grid=document.getElementById("color-grid");
    grid.innerHTML="";

    const used=game.players.map(p=>p.color);

    palette.forEach(color=>{
        const usedByOther=used.includes(color)&&game.players[i].color!==color;

        const d=document.createElement("div");
        d.className="swatch"+(usedByOther?" disabled":"")+(game.players[i].color===color?" selected":"");
        d.style.background=color;

        if(!usedByOther) d.onclick=()=>selectColor(color);

        grid.appendChild(d);
    });

    document.getElementById("color-overlay").style.display="flex";
}

function selectColor(c){
    const oldColor = game.players[game.pickingFor].color;
game.players[game.pickingFor].color = c;
    document.getElementById(`preview-${game.pickingFor}`).style.background=c;
    closeColorPopup();
    renderPlayerSetup();
}

function closeColorPopup(){
    document.getElementById("color-overlay").style.display="none";
}

function startGame(){
    game.rows = parseInt(document.getElementById("rows").value);
    game.cols = parseInt(document.getElementById("cols").value);
    let count=document.getElementById("pCount").value;

    game.players=game.players.slice(0,count);

    document.getElementById("setup").style.display="none";
    document.getElementById("game").style.display="block";

    initBoard();
}

function initBoard(){
    game.grid = Array(game.rows).fill().map(()=>Array(game.cols).fill(null));
    game.players.forEach(p=>p.score=0);
    game.turn=0;

    const board=document.getElementById("board");
    board.style.gridTemplateColumns=`repeat(${game.cols},1fr)`;
    board.style.gridTemplateRows=`repeat(${game.rows},1fr)`;
    board.innerHTML="";

    for(let r=0;r<game.rows;r++){
        for(let c=0;c<game.cols;c++){
            let cell=document.createElement("div");
            cell.className="cell";
            cell.onclick=()=>openLetter(r,c,cell);
            board.appendChild(cell);
        }
    }

    resizeBoard();
    updateUI();
}

function resizeBoard(){
    const board=document.getElementById("board");
    const gamePanel=document.getElementById("game");
    const scoreBoard=document.getElementById("score-board");

    const gap = 4;
    const border = 8;

    const panelStyle = getComputedStyle(gamePanel);

    const panelPaddingX =
        parseFloat(panelStyle.paddingLeft) +
        parseFloat(panelStyle.paddingRight);

    const panelPaddingY =
        parseFloat(panelStyle.paddingTop) +
        parseFloat(panelStyle.paddingBottom);

    const availableWidth =
        window.innerWidth -
        panelPaddingX -
        40;

    const availableHeight =
        window.innerHeight -
        scoreBoard.offsetHeight -
        panelPaddingY -
        170;

    const totalGapSpaceX = gap * (game.cols - 1);
    const totalGapSpaceY = gap * (game.rows - 1);

let cellSize = Math.floor(
    Math.min(
        (availableWidth - totalGapSpaceX - border) / game.cols,
        (availableHeight - totalGapSpaceY - border) / game.rows
    )
);

    cellSize = Math.max(16, cellSize);

    board.style.gridTemplateColumns=`repeat(${game.cols},${cellSize}px)`;
    board.style.gridTemplateRows=`repeat(${game.rows},${cellSize}px)`;

    Array.from(board.children).forEach(cell=>{
        cell.style.width=cellSize+"px";
        cell.style.height=cellSize+"px";
        cell.style.fontSize=Math.max(10, Math.floor(cellSize * 0.45))+"px";
    });

    cachePositions();
}

window.addEventListener("resize",()=>{
    if(game.grid.length && game.rows && game.cols) resizeBoard();
});

function cachePositions(){
    const board=document.getElementById("board");
    const rect=board.getBoundingClientRect();

    cellPositions=[];

    for(let i=0;i<board.children.length;i++){
        const c=board.children[i].getBoundingClientRect();

        cellPositions.push({
            x:c.left+c.width/2-rect.left,
            y:c.top+c.height/2-rect.top
        });
    }
}

function openLetter(r,c,el){
    if(game.grid[r][c]) return;

    if(game.activeCell) game.activeCell.el.classList.remove("highlighted");

    game.activeCell={r,c,el};
    el.classList.add("highlighted");

    let p=game.players[game.turn];
    document.getElementById("p-prompt").innerText=p.name;
    document.getElementById("p-prompt").style.color=p.color;

    document.getElementById("letter-overlay").style.display="flex";
}

function closeLetterPopup(){
    if(game.activeCell) game.activeCell.el.classList.remove("highlighted");
    document.getElementById("letter-overlay").style.display="none";
}

function makeMove(letter){
    let {r,c,el}=game.activeCell;

    game.grid[r][c]=letter;
    el.innerText=letter;
    el.style.color=game.players[game.turn].color;

    el.classList.remove("highlighted");
    document.getElementById("letter-overlay").style.display="none";

    let score=checkSOS(r,c);

    if(score>0) game.players[game.turn].score+=score;
    else game.turn=(game.turn+1)%game.players.length;

    updateUI();

    if(game.grid.flat().every(x=>x)) alert("Game Over!");
}

function checkSOS(r,c){
    let found=0;
    const dirs=[[0,1],[1,0],[1,1],[1,-1]];
    const get=(y,x)=>(y>=0&&y<game.rows&&x>=0&&x<game.cols)?game.grid[y][x]:null;

    for(const [dy,dx] of dirs){

        if(game.grid[r][c]==="S"){
            if(get(r+dy,c+dx)==="O"&&get(r+2*dy,c+2*dx)==="S"){
                drawLine(r,c,r+2*dy,c+2*dx);
                found++;
            }

            if(get(r-dy,c-dx)==="O"&&get(r-2*dy,c-2*dx)==="S"){
                drawLine(r-2*dy,c-2*dx,r,c);
                found++;
            }
        }

        if(game.grid[r][c]==="O"){
            if(get(r-dy,c-dx)==="S"&&get(r+dy,c+dx)==="S"){
                drawLine(r-dy,c-dx,r+dy,c+dx);
                found++;
            }
        }
    }

    return found;
}

function drawLine(r1,c1,r2,c2){
    const board=document.getElementById("board");

    const i1=r1*game.cols+c1;
    const i2=r2*game.cols+c2;

    const p1=cellPositions[i1];
    const p2=cellPositions[i2];

    const line=document.createElement("div");
    line.className="sos-line";

    const dx=p2.x-p1.x;
    const dy=p2.y-p1.y;

    const len=Math.sqrt(dx*dx+dy*dy);
    const ang=Math.atan2(dy,dx);

    line.style.width=len+"px";
    line.style.left=p1.x+"px";
    line.style.top=p1.y+"px";
    line.style.transform=`rotate(${ang}rad)`;
    line.style.background=game.players[game.turn].color;

    board.appendChild(line);
}

function updateUI(){
    document.getElementById("score-board").innerHTML=
        game.players.map((p,i)=>`
        <div style="color:${p.color};border-bottom:${i===game.turn?'3px solid '+p.color:'1px solid #333'};padding:5px;">
        ${p.name}: <b>${p.score}</b>
        </div>
        `).join("");
}

renderPlayerSetup();
</script>

</body>
</html>
