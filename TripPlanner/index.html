<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes"
    />
    <title>TripPlan - Smart Zoom Planner</title>
    <!-- Created by Mark Livera 2026 -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <link rel="stylesheet" href="Trip planner.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="header-bar">
        <div class="title">
          <i class="fas fa-globe-americas"></i> Trip Planner
        </div>
        <div class="holiday-name-area">
          <label><i class="fas fa-umbrella-beach"></i> Holiday:</label>
          <input
            type="text"
            id="holidayNameInput"
            placeholder="e.g., Norway Fjords"
            value=""
          />
        </div>
        <div class="button-group" style="display: flex; gap: 0.5rem">
          <button id="saveJsonBtn"><i class="fas fa-save"></i> Save</button>
          <button id="loadJsonBtn" class="file-label">
            <i class="fas fa-folder-open"></i> Load
          </button>
          <input
            type="file"
            id="loadFileInput"
            accept=".json"
            style="display: none"
          />
          <button id="printBtn"><i class="fas fa-print"></i> Print</button>
          <button id="resetBtn"><i class="fas fa-trash-alt"></i> Reset</button>
        </div>
      </div>
      <div class="sidebar">
        <div class="itinerary-header">
          <div class="itinerary-title-group">
            <h2><i class="fas fa-map-marked-alt"></i> Itinerary</h2>
          </div>
          <div class="button-group-inline">
            <button id="toggleViewBtn" class="compact-toggle-btn">
              <i class="fas fa-compress-alt"></i> Compact
            </button>
            <button id="addSegmentBtn" class="add-leg-btn">
              <i class="fas fa-plus-circle"></i>
              <span class="full-text">Add Leg</span>
              <span class="mobile-text">Add</span>
            </button>
          </div>
        </div>
        <div id="itineraryList"></div>
        <div class="cost-summary" id="costSummary"></div>
      </div>
      <div class="map-container">
        <div id="map"></div>
        <div class="map-toolbar">
          <button id="zoomToFitBtn" class="map-control-btn">
            <i class="fas fa-expand-alt"></i> Zoom to Fit
          </button>
        </div>
        <div class="metro-zoom-hint" id="metroZoomHint">
          <i class="fas fa-map-pin"></i> Click any pin → Metro zoom
        </div>
      </div>
    </div>
    <div class="loading-indicator" id="loadingIndicator">
      <i class="fas fa-fan fa-spin"></i> Loading routes...
    </div>
    <div id="printMapReport" class="print-map-report"></div>
    <div id="notesModal" class="modal-overlay">
      <div class="notes-modal">
        <div class="modal-header">
          <h3><i class="fas fa-sticky-note"></i> Leg Notes</h3>
          <button class="modal-close" id="closeModalBtn">
            <i class="fas fa-times"></i>
          </button>
        </div>
        <div class="modal-body">
          <textarea
            id="notesTextarea"
            placeholder="Add any notes, booking links, confirmation numbers, or reminders...&#10;&#10;Example:&#10;🏨 Hotel confirmation: ABC123&#10;✈️ Flight booking: https://...&#10;🚗 Rental car reference: ..."
          ></textarea>
        </div>
        <div class="modal-footer">
          <button id="cancelNotesBtn" class="file-label">Cancel</button>
          <button id="saveNotesBtn" class="btn-save-note">
            <i class="fas fa-save"></i> Save Notes
          </button>
        </div>
      </div>
    </div>

    <script src="Trip planner.js"></script>
    <div class="app-version">v2608.04G</div>
  </body>
</html>
