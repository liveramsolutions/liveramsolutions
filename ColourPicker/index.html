<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Studio & Accessibility Suite</title>
  <!-- Created by Mark Livera 2026 -->
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #142031;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      width: 400px;
    }
    h2 { 
      margin: 0 0 20px 0; 
      color: #222; 
      text-align: center; 
    }
    .preview-box {
      width: 100%;
      height: 120px;
      border-radius: 14px;
      margin: 15px 0;
      border: 1px solid #e1e4e8;
    }
    input[type="color"] {
      -webkit-appearance: none;
      appearance: none; 
      border: none; 
      width: 100%; 
      height: 45px; 
      border-radius: 10px; 
      cursor: pointer; 
      background: none;
    }
    input[type="color"]::-webkit-color-swatch { 
      border: 1px solid #e1e4e8; 
      border-radius: 10px; 
    }
    .values-container { 
      display: grid; 
      gap: 10px; 
      margin: 15px 0; 
    }
    .value-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      background: #f8f9fa; 
      padding: 10px 14px; 
      border-radius: 10px; 
    }
    .code-info { 
      font-family: monospace; 
      font-size: 13px; 
    }
    .label { 
      color: #666; 
      font-weight: bold; 
      margin-right: 8px; 
    }
    .slider-group { 
      margin: 15px 0; 
    }
    .slider-label { 
      display: flex; 
      justify-content: space-between; 
      font-size: 13px; 
      font-weight: bold; 
      color: #495057; 
      margin-bottom: 5px; 
    }
    input[type="range"] { 
      width: 100%; 
      margin-bottom: 10px; 
      accent-color: #212529; 
    }
    .btn { 
      background: #e9ecef; 
      border: none; 
      padding: 6px 12px; 
      border-radius: 6px; 
      cursor: pointer; 
      font-size: 12px; 
      font-weight: 600; 
      color: #495057; 
      transition: all 0.15s ease; 
    }
    .btn:hover { 
      background: #dee2e6; 
    }
    .save-btn { 
      width: 100%; 
      background: #212529; 
      color: white; 
      padding: 12px; 
      border-radius: 10px; 
      font-size: 14px; 
      margin-bottom: 20px; 
    }
    .save-btn:hover { 
      background: #343a40; 
    }
    .wcag-panel { 
      background: #f8f9fa; 
      padding: 15px; 
      border-radius: 12px; 
      border: 1px solid #e9ecef; 
      margin-bottom: 20px; 
    }
    .wcag-title { 
      font-size: 14px; 
      font-weight: bold; 
      margin-bottom: 10px; 
      color: #333; 
    }
    .wcag-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 6px 0; 
      font-size: 13px; 
    }
    .badge { 
      padding: 4px 8px; 
      border-radius: 6px; 
      font-weight: bold; 
      font-size: 11px; 
    }
    .badge.pass { 
      background: #d4edda; 
      color: #155724; 
    }
    .badge.fail { 
      background: #f8d7da; 
      color: #721c24; 
    }
    .palette-section { 
      border-top: 1px solid #eee; 
      padding-top: 15px; 
    }
    .palette-title { 
      font-size: 14px; 
      font-weight: bold; 
      color: #495057; 
      margin-bottom: 10px; 
    }
    .palette-grid { 
      display: flex; 
      flex-wrap: wrap; 
      gap: 8px; 
      min-height: 40px; 
    }
    .swatch { 
      width: 42px; 
      height: 42px; 
      border-radius: 8px; 
      border: 1px solid #dee2e6; 
      cursor: pointer; 
      transition: transform 0.15s ease; 
    }
    .swatch:hover { 
      transform: scale(1.1); 
    }
    .app-version {
        position: fixed;
        bottom: 6px;
        right: 10px;
        font-size: 10px;
        color: #888888;
        font-family: monospace, sans-serif;
        font-weight: 500;
        letter-spacing: 0.5px;
        z-index: 9999;
        pointer-events: none;
        user-select: none;
      }
  </style>
</head>
<body>

  <div class="container">
    <h2>Elite Color Studio</h2>
    
    <input type="color" id="picker" value="#888888">
    <div class="preview-box" id="preview"></div>
    
    <div class="slider-group">
      <!-- Range set from -100 to 100, default at 0 (Middle) -->
      <div class="slider-label"><span>Lighten / Darken</span><span id="dark-val">0%</span></div>
      <input type="range" id="darkness-slider" min="-100" max="100" value="0">
      
      <div class="slider-label"><span>Warm / Cool Tone</span><span id="tint-val">0%</span></div>
      <input type="range" id="tint-slider" min="-100" max="100" value="0">
    </div>
    
    <div class="values-container">
      <div class="value-row">
        <div class="code-info"><span class="label">HEX:</span><span class="code" id="hex-val">#888888</span></div>
        <button class="btn" onclick="copyText('hex-val', event)">Copy</button>
      </div>
      <div class="value-row">
        <div class="code-info"><span class="label">RGB:</span><span class="code" id="rgb-val">rgb(136, 136, 136)</span></div>
        <button class="btn" onclick="copyText('rgb-val', event)">Copy</button>
      </div>
    </div>

    <div class="wcag-panel">
      <div class="wcag-title">WCAG 2.1 Contrast Check (Small Text)</div>
      <div class="wcag-row">
        <span>Contrast Ratio:</span>
        <span id="contrast-ratio" style="font-weight: bold;">3.0:1</span>
      </div>
      <div class="wcag-row">
        <span>Using White Text (#FFF):</span>
        <span id="wcag-white" class="badge fail">Fail</span>
      </div>
      <div class="wcag-row">
        <span>Using Dark Text (#111):</span>
        <span id="wcag-dark" class="badge fail">Fail</span>
      </div>
    </div>

    <button class="btn save-btn" id="save-btn">Save to Palette</button>

    <div class="palette-section">
      <div class="palette-title">Saved Swatches</div>
      <div class="palette-grid" id="palette-grid"></div>
    </div>
  </div>

  <script>
    const picker = document.getElementById('picker');
    const preview = document.getElementById('preview');
    const hexVal = document.getElementById('hex-val');
    const rgbVal = document.getElementById('rgb-val');
    const darknessSlider = document.getElementById('darkness-slider');
    const tintSlider = document.getElementById('tint-slider');
    const darkVal = document.getElementById('dark-val');
    const tintVal = document.getElementById('tint-val');
    const contrastRatioDisp = document.getElementById('contrast-ratio');
    const wcagWhiteDisp = document.getElementById('wcag-white');
    const wcagDarkDisp = document.getElementById('wcag-dark');
    const saveBtn = document.getElementById('save-btn');
    const paletteGrid = document.getElementById('palette-grid');

    let baseColor = picker.value;

    function hexToRgbObj(hex) {
      return {
        r: parseInt(hex.slice(1, 3), 16),
        g: parseInt(hex.slice(3, 5), 16),
        b: parseInt(hex.slice(5, 7), 16)
      };
    }

    function rgbToHex(r, g, b) {
      return "#" + [r, g, b].map(x => {
        const clamped = Math.max(0, Math.min(255, Math.round(x)));
        return clamped.toString(16).padStart(2, '0');
      }).join('');
    }

    function getLuminance(r, g, b) {
      let [a, bC, c] = [r, g, b].map(v => {
        v /= 255;
        return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
      });
      return a * 0.2126 + bC * 0.7152 + c * 0.0722;
    }

    function evaluateAccessibility(r, g, b) {
      const bgLum = getLuminance(r, g, b);
      const whiteLum = getLuminance(255, 255, 255);
      const darkLum = getLuminance(17, 17, 17);

      const ratioWhite = (Math.max(bgLum, whiteLum) + 0.05) / (Math.min(bgLum, whiteLum) + 0.05);
      const ratioDark = (Math.max(bgLum, darkLum) + 0.05) / (Math.min(bgLum, darkLum) + 0.05);

      contrastRatioDisp.textContent = `${Math.max(ratioWhite, ratioDark).toFixed(1)}:1`;

      updateBadge(wcagWhiteDisp, ratioWhite >= 4.5);
      updateBadge(wcagDarkDisp, ratioDark >= 4.5);
    }

    function updateBadge(element, passes) {
      element.textContent = passes ? "Pass (AA)" : "Fail";
      element.className = `badge ${passes ? 'pass' : 'fail'}`;
    }

    function processColorTransformations() {
      let { r, g, b } = hexToRgbObj(baseColor);
      
      // Values map from -1.0 to 1.0
      const lightDarkFactor = darknessSlider.value / 100;
      const toneFactor = tintSlider.value / 100;

      // 1. Apply Independent Lighten (negative) or Darken (positive) logic
      if (lightDarkFactor > 0) {
        // Slide right: darken towards black
        r *= (1 - lightDarkFactor);
        g *= (1 - lightDarkFactor);
        b *= (1 - lightDarkFactor);
      } else if (lightDarkFactor < 0) {
        // Slide left: lighten towards white
        const factor = Math.abs(lightDarkFactor);
        r += (255 - r) * factor;
        g += (255 - g) * factor;
        b += (255 - b) * factor;
      }

      // 2. Apply Independent Warm (negative) or Cool (positive) logic
      if (toneFactor < 0) {
        // Slide left: Warm tone (Boost Red, attenuate Blue)
        const factor = Math.abs(toneFactor);
        r += (255 - r) * (factor * 0.5);
        b *= (1 - (factor * 0.5));
      } else if (toneFactor > 0) {
        // Slide right: Cool tone (Boost Blue, attenuate Red)
        r *= (1 - (toneFactor * 0.5));
        b += (255 - b) * (toneFactor * 0.5);
      }

      const finalHex = rgbToHex(r, g, b).toUpperCase();
      
      preview.style.backgroundColor = finalHex;
      hexVal.textContent = finalHex;
      rgbVal.textContent = `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`;
      
      evaluateAccessibility(r, g, b);
    }

    function copyText(elementId, event) {
      navigator.clipboard.writeText(document.getElementById(elementId).textContent);
      const btn = event.target; 
      const orig = btn.textContent;
      btn.textContent = "Copied!"; 
      btn.style.background = "#d4edda";
      setTimeout(() => { 
        btn.textContent = orig; 
        btn.style.background = ""; 
      }, 800);
    }

    // Helper UI label mapping
    function formatLabel(val, leftLabel, rightLabel) {
      if (val > 0) return `+${val}% ${rightLabel}`;
      if (val < 0) return `+${Math.abs(val)}% ${leftLabel}`;
      return "0%";
    }

    picker.addEventListener('input', (e) => {
      baseColor = e.target.value;
      darknessSlider.value = 0; darkVal.textContent = "0%";
      tintSlider.value = 0; tintVal.textContent = "0%";
      processColorTransformations();
    });

    darknessSlider.addEventListener('input', (e) => {
      darkVal.textContent = formatLabel(e.target.value, "Light", "Dark");
      processColorTransformations();
    });

    tintSlider.addEventListener('input', (e) => {
      tintVal.textContent = formatLabel(e.target.value, "Warm", "Cool");
      processColorTransformations();
    });

    saveBtn.addEventListener('click', () => {
      const currentHex = hexVal.textContent;
      if (document.querySelector(`[data-color="${currentHex}"]`)) return;

      const swatch = document.createElement('div');
      swatch.className = 'swatch'; 
      swatch.style.backgroundColor = currentHex;
      swatch.setAttribute('data-color', currentHex);
      swatch.title = `Left-click to load\nRight-click to delete`;

      swatch.addEventListener('click', () => {
        baseColor = currentHex;
        picker.value = currentHex.toLowerCase();
        darknessSlider.value = 0; darkVal.textContent = "0%";
        tintSlider.value = 0; tintVal.textContent = "0%";
        processColorTransformations();
      });

      swatch.addEventListener('contextmenu', (e) => { 
        e.preventDefault(); 
        swatch.remove(); 
      });
      paletteGrid.appendChild(swatch);
    });

    processColorTransformations();

  </script>
  <div class="app-version">v2608.03C</div>
</body>
</html>
